name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  style-check:
    name: Style Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npm run prettier:check

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3307:3306
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_ROOT_HOST: "%"
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Initialize test database
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3307
          DB_INIT_USER: root
          DB_INIT_PASSWORD: rootpassword
          DB_NAME: gym
          DB_USER: gymuser
          DB_PASSWORD: Testing123!
          DATA_SEED: "true"
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: testing123
        run: node backend/src/scripts/initializeDatabase.mjs

      - name: Run unit tests
        id: tests
        shell: bash
        run: |
          set +e
          node --experimental-vm-modules ./node_modules/jest/bin/jest.js \
            --coverage \
            --verbose \
            backend/src/tests > unit-test-results.txt 2>&1
          test_status=$?
          cat unit-test-results.txt
          {
            echo "## Unit test results"
            echo
            echo '```text'
            cat unit-test-results.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "status=$test_status" >> "$GITHUB_OUTPUT"
          exit "$test_status"

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            unit-test-results.txt
            coverage/
          if-no-files-found: warn

  publish:
    name: Publish Docker Hub image
    needs: [unit-tests]
    # needs: [style-check, unit-tests]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/gym
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tags
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

      - name: Update Docker Hub README
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          readme-filepath: ./readme.md
