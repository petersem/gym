name: Unit Tests

on:
  push:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        id: tests
        shell: bash
        run: |
          set +e
          node --experimental-vm-modules ./node_modules/jest/bin/jest.js \
            --coverage \
            --verbose \
            backend/src/tests/models > unit-test-results.txt 2>&1
          test_status=$?
          cat unit-test-results.txt
          {
            echo "## Unit test results"
            echo
            echo '```text'
            cat unit-test-results.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "status=$test_status" >> "$GITHUB_OUTPUT"
          exit "$test_status"

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            unit-test-results.txt
            coverage/
          if-no-files-found: warn
