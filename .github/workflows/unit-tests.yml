name: Unit Tests

on:
  push:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3307:3306
        env:
          MYSQL_DATABASE: gym
          MYSQL_USER: gymuser
          MYSQL_PASSWORD: Testing123!
          MYSQL_ROOT_PASSWORD: rootpassword
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install --yes mysql-client

      - name: Initialize test database
        run: |
          mysql --host=127.0.0.1 --port=3307 --user=gymuser --password=Testing123! gym < db/schema.sql
          mysql --host=127.0.0.1 --port=3307 --user=gymuser --password=Testing123! gym < db/seed.sql

      - name: Run unit tests
        id: tests
        shell: bash
        run: |
          set +e
          node --experimental-vm-modules ./node_modules/jest/bin/jest.js \
            --coverage \
            --verbose \
            backend/src/tests > unit-test-results.txt 2>&1
          test_status=$?
          cat unit-test-results.txt
          {
            echo "## Unit test results"
            echo
            echo '```text'
            cat unit-test-results.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "status=$test_status" >> "$GITHUB_OUTPUT"
          exit "$test_status"

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            unit-test-results.txt
            coverage/
          if-no-files-found: warn
