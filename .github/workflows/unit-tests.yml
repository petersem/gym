name: Unit Tests

on:
  push:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3307:3306
        env:
          MYSQL_DATABASE: gym
          MYSQL_USER: gymuser
          MYSQL_PASSWORD: Testing123!
          MYSQL_ROOT_PASSWORD: rootpassword
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install --yes mysql-client

      - name: Initialize test database
        run: |
          mysql --host=127.0.0.1 --port=3307 --user=gymuser --password=Testing123! gym <<'SQL'
          CREATE TABLE IF NOT EXISTS users (
            id INT NOT NULL AUTO_INCREMENT,
            first_name VARCHAR(45) NOT NULL,
            last_name VARCHAR(45) NOT NULL,
            role ENUM('admin', 'trainer', 'member') NOT NULL,
            email VARCHAR(100) NOT NULL UNIQUE,
            password VARCHAR(70) NOT NULL,
            phone VARCHAR(20) NOT NULL,
            dob DATE NULL,
            deleted TINYINT NOT NULL DEFAULT 0,
            authentication_key VARCHAR(36) NULL,
            PRIMARY KEY (id)
          );

          CREATE TABLE IF NOT EXISTS activities (
            id INT NOT NULL AUTO_INCREMENT,
            name VARCHAR(45) NOT NULL,
            description VARCHAR(150) NULL,
            deleted TINYINT NOT NULL DEFAULT 0,
            updated_by INT NOT NULL DEFAULT 1,
            PRIMARY KEY (id),
            CONSTRAINT fk_activity_updated_by FOREIGN KEY (updated_by) REFERENCES users (id)
          );

          CREATE TABLE IF NOT EXISTS locations (
            id INT NOT NULL AUTO_INCREMENT,
            name VARCHAR(100) NOT NULL,
            phone VARCHAR(20) NOT NULL,
            email VARCHAR(45) NOT NULL,
            street VARCHAR(100) NOT NULL,
            city VARCHAR(100) NOT NULL,
            postcode INT NOT NULL,
            manager INT NOT NULL,
            deleted TINYINT NOT NULL DEFAULT 0,
            updated_by INT NOT NULL DEFAULT 1,
            PRIMARY KEY (id),
            CONSTRAINT fk_location_manager FOREIGN KEY (manager) REFERENCES users (id),
            CONSTRAINT fk_location_updated_by FOREIGN KEY (updated_by) REFERENCES users (id)
          );

          CREATE TABLE IF NOT EXISTS sessions (
            id INT NOT NULL AUTO_INCREMENT,
            title VARCHAR(200) NOT NULL,
            activity_id INT NOT NULL,
            location_id INT NOT NULL,
            trainer_id INT NOT NULL,
            date DATE NOT NULL,
            time TIME NOT NULL,
            PRIMARY KEY (id),
            CONSTRAINT fk_session_activity FOREIGN KEY (activity_id) REFERENCES activities (id),
            CONSTRAINT fk_session_location FOREIGN KEY (location_id) REFERENCES locations (id),
            CONSTRAINT fk_session_trainer FOREIGN KEY (trainer_id) REFERENCES users (id)
          );

          CREATE TABLE IF NOT EXISTS bookings (
            id INT NOT NULL AUTO_INCREMENT,
            session_id INT NOT NULL,
            user_id INT NOT NULL,
            created DATETIME NOT NULL,
            PRIMARY KEY (id),
            CONSTRAINT fk_booking_session FOREIGN KEY (session_id) REFERENCES sessions (id),
            CONSTRAINT fk_booking_user FOREIGN KEY (user_id) REFERENCES users (id)
          );

          CREATE TABLE IF NOT EXISTS blog (
            id INT NOT NULL AUTO_INCREMENT,
            create_date DATETIME NOT NULL,
            user_id INT NOT NULL,
            subject VARCHAR(100) NOT NULL,
            body VARCHAR(250) NOT NULL,
            PRIMARY KEY (id),
            CONSTRAINT fk_blog_user FOREIGN KEY (user_id) REFERENCES users (id)
          );

          INSERT INTO users
            (id, first_name, last_name, role, email, password, phone, dob, deleted)
          VALUES
            (1, 'GitHub', 'Test User', 'admin', 'github-test@example.com', 'seeded', '0000000000', '2000-01-01', 0)
          ON DUPLICATE KEY UPDATE id = id;
          SQL

      - name: Run unit tests
        id: tests
        shell: bash
        run: |
          set +e
          node --experimental-vm-modules ./node_modules/jest/bin/jest.js \
            --coverage \
            --verbose \
            backend/src/tests > unit-test-results.txt 2>&1
          test_status=$?
          cat unit-test-results.txt
          {
            echo "## Unit test results"
            echo
            echo '```text'
            cat unit-test-results.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "status=$test_status" >> "$GITHUB_OUTPUT"
          exit "$test_status"

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            unit-test-results.txt
            coverage/
          if-no-files-found: warn
