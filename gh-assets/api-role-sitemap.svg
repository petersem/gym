    <text x="570" y="438">&#x2014;</text>
    <text x="900" y="438">&#x2014;</text>
    <text x="570" y="474">&#x2014;</text>
    <text x="790" y="474">&#x2014;</text>
    <text x="900" y="474">&#x2014;</text>
    <text x="570" y="510">&#x2014;</text>
    <text x="790" y="510">&#x2014;</text>
    <text x="900" y="510">&#x2014;</text>
    <text x="570" y="546">&#x2014;</text>
    <text x="790" y="546">&#x2014;</text>
    <text x="900" y="546">&#x2014;</text>
    <text x="570" y="582">&#x2014;</text>
    <text x="680" y="582">&#x2014;</text>
    <text x="900" y="582">&#x2014;</text>
    <text x="570" y="618">&#x2014;</text>
    <text x="680" y="618">&#x2014;</text>
    <text x="900" y="618">&#x2014;</text>
    <text x="570" y="654">&#x2014;</text>
    <text x="900" y="654">&#x2014;</text>
    <text x="680" y="690">&#x2014;</text>
    <text x="790" y="690">&#x2014;</text>
    <text x="900" y="690">&#x2014;</text>
  </g>
  <path d="M20 710H940" stroke="#dfe7e0"/>
  <g class="note">
    <text x="20" y="734">&#x2713; Allowed    &#x2014; No access    &#xB9; Own record / own post / assigned session only.</text>
    <text x="20" y="758">&#xB2; Trainers read bookings for sessions assigned to them, regardless of who made the booking.</text>
    <text x="20" y="782">&#xB3; The /blogs, /timetable and /bookings lists accept search_term, sort_by and sort_dir; results stay within the role&#x2019;s access.</text>
        <text x="20" y="806">&#x2074; Guests only (no x-auth-key); new accounts always get the member role.</text>
      </g>
</svg>
