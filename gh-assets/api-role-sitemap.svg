    <text x="900" y="186">&#x2014;</text>
    <text x="900" y="222">&#x2014;</text>
    <text x="570" y="258">&#x2014;</text>
    <text x="900" y="258">&#x2014;</text>
    <text x="570" y="294">&#x2014;</text>
    <text x="900" y="294">&#x2014;</text>
    <text x="570" y="330">&#x2014;</text>
