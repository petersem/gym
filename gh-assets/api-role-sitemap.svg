<svg xmlns="http://www.w3.org/2000/svg" width="960" height="842" viewBox="0 0 960 842" role="img" aria-labelledby="title description">
  <title id="title">Gym API access by role</title>
  <desc id="description">Guest, Member, Trainer and Admin API permissions. Guests can read blogs and register a new member account. Only authenticated members and trainers can view the timetable, locations and trainer list. Activity endpoints are not available. Members and trainers can authenticate, read and update their own profile, and create blog posts or edit and delete their own posts. Members can read, create and cancel their own bookings and download them as XML. Trainers can read bookings for sessions assigned to them and delete and download their own upcoming sessions as XML, but cannot make or cancel bookings. The blog, timetable and booking lists can be searched and sorted within each role&#x2019;s access. Administrators have no API access. Documentation remains public.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #17231d; }
    .heading { font-weight: 700; }
    .title { font-size: 22px; font-weight: 700; }
    .note { font-size: 14px; fill: #526158; }
    .tick { text-anchor: middle; font-size: 18px; font-weight: 700; }
    .guest rect { fill: #1d4ed8; }
    .guest text { fill: #ffffff; }
    .member rect { fill: #15803d; }
    .member text { fill: #ffffff; }
    .trainer rect { fill: #f97316; }
    .trainer text { fill: #17231d; }
    .admin rect { fill: #7e22ce; }
    .admin text { fill: #ffffff; }
    .guest { --badge-background: #1d4ed8; --badge-text: #ffffff; }
    .member { --badge-background: #15803d; --badge-text: #ffffff; }
    .trainer { --badge-background: #f97316; --badge-text: #17231d; }
    .admin { --badge-background: #7e22ce; --badge-text: #ffffff; }
    .badge-background { fill: var(--badge-background); }
    .tick { fill: var(--badge-text); }
    .unavailable { fill: #65736b; text-anchor: middle; }
  </style>
  <defs>
    <g id="allowed">
      <rect class="badge-background" x="-24" y="-18" width="48" height="25" rx="5"/>
      <text class="tick" y="1">&#x2713;</text>
    </g>
    <g id="own">
      <rect class="badge-background" x="-24" y="-18" width="48" height="25" rx="5"/>
      <text class="tick" y="1">&#x2713;&#xB9;</text>
    </g>
    <g id="linked">
      <rect class="badge-background" x="-24" y="-18" width="48" height="25" rx="5"/>
      <text class="tick" y="1">&#x2713;&#xB2;</text>
    </g>
  </defs>
  <rect x="1" y="1" width="958" height="840" rx="10" fill="#ffffff" stroke="#dfe7e0"/>
  <text x="20" y="36" class="title">API Access by Role</text>
  <text x="20" y="61" class="note">Base path: /api/v1 &#x2022; Member and Trainer access requires an x-auth-key.</text>
  <path d="M1 80H959V126H1Z" fill="#f3f6f2"/>
  <text x="20" y="109" class="heading">Operation</text>
  <g class="heading" text-anchor="middle">
    <g class="guest"><rect x="526" y="88" width="88" height="30" rx="5"/><text x="570" y="109">Guest</text></g>
    <g class="member"><rect x="636" y="88" width="88" height="30" rx="5"/><text x="680" y="109">Member</text></g>
    <g class="trainer"><rect x="746" y="88" width="88" height="30" rx="5"/><text x="790" y="109">Trainer</text></g>
    <g class="admin"><rect x="856" y="88" width="88" height="30" rx="5"/><text x="900" y="109">Admin</text></g>
  </g>
  <g stroke="#edf0ed">
    <path d="M1 162H959M1 198H959M1 234H959M1 270H959M1 306H959M1 342H959M1 378H959M1 414H959M1 450H959M1 486H959M1 522H959M1 558H959M1 594H959M1 630H959M1 666H959"/>
  </g>
  <g>
    <text x="20" y="150">Read locations &#x2014; GET /locations, /locations/{id}</text>
    <text x="20" y="186">List trainers &#x2014; GET /trainers</text>
    <text x="20" y="222">Read blogs &#x2014; GET /blogs, /blogs/{id} &#xB3;</text>
    <text x="20" y="258">Create blog &#x2014; POST /blogs</text>
    <text x="20" y="294">Update / delete blog &#x2014; PUT / DELETE /blogs/{id}</text>
    <text x="20" y="330">Read profile &#x2014; GET /user/self, /users/{id}</text>
    <text x="20" y="366">Update profile &#x2014; PUT / PATCH /users/{id}</text>
    <text x="20" y="402">View timetable &#x2014; GET /timetable &#xB3;</text>
    <text x="20" y="438">Read bookings &#x2014; GET /bookings, /bookings/{id} &#xB3;</text>
    <text x="20" y="474">Make booking &#x2014; POST /bookings</text>
    <text x="20" y="510">Cancel booking &#x2014; DELETE /bookings/{id}</text>
    <text x="20" y="546">Export bookings XML &#x2014; GET /bookings/export.xml</text>
    <text x="20" y="582">Delete session &#x2014; DELETE /sessions/{id}</text>
    <text x="20" y="618">Export sessions XML &#x2014; GET /sessions/export.xml</text>
    <text x="20" y="654">Log in / out &#x2014; POST / DELETE /authenticate</text>
    <text x="20" y="690">Register member &#x2014; POST /register &#x2074;</text>
  </g>
  <g class="guest">
    <use href="#allowed" x="570" y="222"/>
    <use href="#allowed" x="570" y="690"/>
  </g>
  <g class="member">
    <use href="#allowed" x="680" y="150"/>
    <use href="#allowed" x="680" y="186"/>
