<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880" role="img" aria-labelledby="title description">
  <title id="title">Hierarchical gym sitemap</title>
  <desc id="description">The Dashboard is the landing page for all roles, displaying a different view for Guest, Member, Trainer and Admin. Dashboard view boxes represent variations of this single page, not separate pages. My bookings sits beneath the Member view and management pages beneath the Admin view. Manage sessions is shared by Trainer and Admin, with trainers limited to their own sessions. Colored circles show access: blue Guest, green Member, orange Trainer and purple Admin. The admin dashboard view and the management pages beneath it are filled purple to show they are admin-only, and the trainer dashboard view is filled orange. The member dashboard view and My bookings are filled green, and the remaining public pages are filled blue.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; font-size: 16px; fill: #17231d; text-anchor: middle; }
    .title { font-size: 28px; font-weight: 700; }
    .label { font-weight: 700; }
    .small { font-size: 13px; }
    .white { fill: #ffffff; }
    .connector { fill: none; stroke: #64748b; stroke-width: 2; stroke-linejoin: round; }
    .page { fill: #f1f5f9; stroke: #cbd5e1; }
    .page.admin-page { fill: #7e22ce; stroke: #6b21a8; }
    .page.trainer-page { fill: #f97316; stroke: #ea580c; }
    .page.member-page { fill: #15803d; stroke: #166534; }
    .page.guest-page { fill: #1d4ed8; stroke: #1e40af; }
    .label.admin-text { fill: #ffffff; }
    .label.trainer-text { fill: #ffffff; }
    .label.member-text { fill: #ffffff; }
    .label.guest-text { fill: #ffffff; }
    circle { stroke: #ffffff; stroke-width: 2; }
    .guest { fill: #1d4ed8; }
    .member { fill: #15803d; }
    .trainer { fill: #f97316; }
    .admin { fill: #7e22ce; }
  </style>
  <rect width="1400" height="880" rx="12" fill="#ffffff"/>
  <text x="700" y="58" class="title">Hierarchical sitemap diagram</text>
  <rect x="470" y="105" width="460" height="56" class="page guest-page"/>
  <text x="700" y="137" class="label guest-text">Dashboard (Home)</text>
  <g aria-label="Member, Trainer, Admin">
    <circle cx="676" cy="161" r="10" class="member"/>
    <circle cx="700" cy="161" r="10" class="trainer"/>
    <circle cx="724" cy="161" r="10" class="admin"/>
  </g>
  <g class="connector">
    <path d="M700 173V200M110 200H1260M110 200V235M300 200V235M490 200V235M730 200V235M990 200V235M1260 200V235"/>
    <path d="M110 200H12V369H25"/>
    <path d="M730 295V325H612V369H630"/>
    <path d="M990 295V597H1160"/>
    <path d="M1260 295V325H1142V749M1142 369H1160M1142 445H1160M1142 521H1160M1142 597H1160M1142 673H1160M1142 749H1160"/>
    <path d="M490 295V325H392V369H410"/>
  </g>

  <g>
    <rect x="25" y="235" width="170" height="48" class="page guest-page"/>
    <text x="110" y="265" class="label guest-text">Timetable</text>
    <circle cx="110" cy="283" r="10" class="member" aria-label="Member"/>
    <text x="110" y="315" class="small">Guest: view only</text>
    <rect x="215" y="235" width="170" height="48" class="page guest-page"/>
    <text x="300" y="265" class="label guest-text">Blogs</text>
    <g aria-label="Member; Trainer">
      <circle cx="288" cy="283" r="10" class="member"/>
      <circle cx="312" cy="283" r="10" class="trainer"/>
    </g>
    <text x="300" y="315" class="small">Guest: view only</text>
    <rect x="25" y="345" width="170" height="48" class="page guest-page"/>
    <text x="110" y="375" class="label guest-text">Privacy policy</text>
    <g aria-label="Member, Trainer, Admin">
      <circle cx="86" cy="393" r="10" class="member"/>
      <circle cx="110" cy="393" r="10" class="trainer"/>
      <circle cx="134" cy="393" r="10" class="admin"/>
    </g>
  </g>
  <g>
    <rect x="630" y="235" width="200" height="48" class="page member-page"/>
    <text x="730" y="265" class="label member-text">Member dashboard view</text>
    <rect x="630" y="345" width="200" height="48" class="page member-page"/>
    <text x="730" y="375" class="label member-text">My bookings</text>
    <rect x="890" y="235" width="200" height="48" class="page trainer-page"/>
    <text x="990" y="265" class="label trainer-text">Trainer dashboard view</text>
  </g>
  <g>
    <rect x="1160" y="235" width="200" height="48" class="page admin-page"/>
    <text x="1260" y="265" class="label admin-text">Admin dashboard view</text>
    <rect x="1160" y="345" width="200" height="48" class="page admin-page"/>
    <text x="1260" y="375" class="label admin-text">Manage users</text>
    <rect x="1160" y="421" width="200" height="48" class="page admin-page"/>
    <text x="1260" y="451" class="label admin-text">Manage locations</text>
    <rect x="1160" y="497" width="200" height="48" class="page admin-page"/>
    <text x="1260" y="527" class="label admin-text">Manage activities</text>
    <rect x="1160" y="573" width="200" height="48" class="page admin-page"/>
    <text x="1260" y="603" class="label admin-text">Manage sessions</text>
    <circle cx="1260" cy="621" r="10" class="trainer" aria-label="Trainer: own sessions only"/>
    <text x="1260" y="645" class="small">Trainers: own sessions only</text>
    <rect x="1160" y="649" width="200" height="48" class="page admin-page"/>
    <text x="1260" y="679" class="label admin-text">Manage bookings</text>
    <rect x="1160" y="725" width="200" height="48" class="page admin-page"/>
    <text x="1260" y="755" class="label admin-text">Manage blog posts</text>
  </g>
  <g>
    <rect x="405" y="235" width="170" height="48" class="page guest-page"/>
    <text x="490" y="265" class="label guest-text">Log in</text>
    <rect x="410" y="345" width="170" height="48" class="page guest-page"/>
    <text x="495" y="375" class="label guest-text">Register</text>
  </g>

  <rect x="160" y="650" width="840" height="84" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="225" y="681" class="label">Legend</text>
  <circle cx="300" cy="676" r="10" class="guest"/>
  <text x="375" y="682">Guest / Public</text>
  <circle cx="470" cy="676" r="10" class="member"/>
  <text x="528" y="682">Member</text>
  <circle cx="620" cy="676" r="10" class="trainer"/>
  <text x="677" y="682">Trainer</text>
  <circle cx="770" cy="676" r="10" class="admin"/>
  <text x="825" y="682">Admin</text>
  <text x="580" y="717" class="small">Colored circles identify roles with access to each page.</text>
</svg>