<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880" role="img" aria-labelledby="title description">
  <title id="title">Hierarchical gym sitemap</title>
  <desc id="description">The Dashboard is the landing page for all roles, displaying a different view for Guest, Member, Trainer and Admin. Dashboard view boxes represent variations of this single page, not separate pages. My bookings sits beneath the Member view and management pages beneath the Admin view. Manage sessions is shared by Trainer and Admin, with trainers limited to their own sessions. Colored circles show access: blue Guest, green Member, orange Trainer and purple Admin.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; font-size: 16px; fill: #17231d; text-anchor: middle; }
    .title { font-size: 28px; font-weight: 700; }
    .label { font-weight: 700; }
    .small { font-size: 13px; }
    .white { fill: #ffffff; }
    .connector { fill: none; stroke: #64748b; stroke-width: 2; stroke-linejoin: round; }
    .page { fill: #f1f5f9; stroke: #cbd5e1; }
    circle { stroke: #ffffff; stroke-width: 2; }
    .guest { fill: #1d4ed8; }
    .member { fill: #15803d; }
    .trainer { fill: #f97316; }
    .admin { fill: #7e22ce; }
  </style>
  <rect width="1400" height="880" rx="12" fill="#ffffff"/>
  <text x="700" y="58" class="title">Hierarchical sitemap diagram</text>
  <rect x="470" y="105" width="460" height="56" rx="28" class="page"/>
  <text x="700" y="137" class="label">Dashboard (Home)</text>
  <g aria-label="Guest, Member, Trainer, Admin">
    <circle cx="664" cy="161" r="10" class="guest"/>
    <circle cx="688" cy="161" r="10" class="member"/>
    <circle cx="712" cy="161" r="10" class="trainer"/>
    <circle cx="736" cy="161" r="10" class="admin"/>
  </g>
  <g class="connector">
    <path d="M700 173V200M110 200H1260M110 200V235M300 200V235M490 200V235M730 200V235M990 200V235M1260 200V235"/>
    <path d="M110 200H12V369H25"/>
    <path d="M730 295V325H612V369H630"/>
    <path d="M990 295V597H1160"/>
    <path d="M1260 295V325H1142V749M1142 369H1160M1142 445H1160M1142 521H1160M1142 597H1160M1142 673H1160M1142 749H1160"/>
    <path d="M490 295V325H392V369H410"/>
  </g>

  <g>
    <rect x="25" y="235" width="170" height="48" rx="24" class="page"/>
    <text x="110" y="265" class="label">Timetable</text>
    <g aria-label="Guest: view only; Member">
      <circle cx="98" cy="283" r="10" class="guest"/>
      <circle cx="122" cy="283" r="10" class="member"/>
    </g>
    <text x="98" y="315" class="small">Guest: view only</text>
    <rect x="215" y="235" width="170" height="48" rx="24" class="page"/>
    <text x="300" y="265" class="label">Blogs</text>
    <g aria-label="Guest: view only; Member; Trainer">
      <circle cx="276" cy="283" r="10" class="guest"/>
      <circle cx="300" cy="283" r="10" class="member"/>
      <circle cx="324" cy="283" r="10" class="trainer"/>
    </g>
    <text x="276" y="315" class="small">Guest: view only</text>
    <rect x="25" y="345" width="170" height="48" rx="24" class="page"/>
    <text x="110" y="375" class="label">Privacy policy</text>
    <g aria-label="Guest, Member, Trainer, Admin">
      <circle cx="74" cy="393" r="10" class="guest"/>
      <circle cx="98" cy="393" r="10" class="member"/>
      <circle cx="122" cy="393" r="10" class="trainer"/>
      <circle cx="146" cy="393" r="10" class="admin"/>
    </g>
  </g>
  <g>
    <rect x="630" y="235" width="200" height="48" rx="24" class="page"/>
    <text x="730" y="265" class="label">Member dashboard view</text>
    <circle cx="730" cy="283" r="10" class="member" aria-label="Member"/>
    <rect x="630" y="345" width="200" height="48" rx="24" class="page"/>
    <text x="730" y="375" class="label">My bookings</text>
    <circle cx="730" cy="393" r="10" class="member" aria-label="Member"/>
    <rect x="890" y="235" width="200" height="48" rx="24" class="page"/>
    <text x="990" y="265" class="label">Trainer dashboard view</text>
    <circle cx="990" cy="283" r="10" class="trainer" aria-label="Trainer"/>
  </g>
  <g>
    <rect x="1160" y="235" width="200" height="48" rx="24" class="page"/>
    <text x="1260" y="265" class="label">Admin dashboard view</text>
    <circle cx="1260" cy="283" r="10" class="admin" aria-label="Admin"/>
    <rect x="1160" y="345" width="200" height="48" rx="24" class="page"/>
    <text x="1260" y="375" class="label">Manage users</text>
    <circle cx="1260" cy="393" r="10" class="admin" aria-label="Admin"/>
    <rect x="1160" y="421" width="200" height="48" rx="24" class="page"/>
    <text x="1260" y="451" class="label">Manage locations</text>
    <circle cx="1260" cy="469" r="10" class="admin" aria-label="Admin"/>
    <rect x="1160" y="497" width="200" height="48" rx="24" class="page"/>
    <text x="1260" y="527" class="label">Manage activities</text>
    <circle cx="1260" cy="545" r="10" class="admin" aria-label="Admin"/>
    <rect x="1160" y="573" width="200" height="48" rx="24" class="page"/>
    <text x="1260" y="603" class="label">Manage sessions</text>
    <g aria-label="Trainer: own sessions only; Admin">
      <circle cx="1248" cy="621" r="10" class="trainer"/>
      <circle cx="1272" cy="621" r="10" class="admin"/>
    </g>
    <text x="1260" y="645" class="small">Trainers: own sessions only</text>
    <rect x="1160" y="649" width="200" height="48" rx="24" class="page"/>
    <text x="1260" y="679" class="label">Manage bookings</text>
    <circle cx="1260" cy="697" r="10" class="admin" aria-label="Admin"/>
    <rect x="1160" y="725" width="200" height="48" rx="24" class="page"/>
    <text x="1260" y="755" class="label">Manage blog posts</text>
    <circle cx="1260" cy="773" r="10" class="admin" aria-label="Admin"/>
  </g>
  <g>
    <rect x="405" y="235" width="170" height="48" rx="24" class="page"/>
    <text x="490" y="265" class="label">Log in</text>
    <circle cx="490" cy="283" r="10" class="guest" aria-label="Guest"/>
    <rect x="410" y="345" width="170" height="48" rx="24" class="page"/>
    <text x="495" y="375" class="label">Register</text>
    <circle cx="495" cy="393" r="10" class="guest" aria-label="Guest"/>
  </g>

  <rect x="160" y="650" width="840" height="84" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="225" y="681" class="label">Legend</text>
  <circle cx="300" cy="676" r="10" class="guest"/>
  <text x="375" y="682">Guest / Public</text>
  <circle cx="470" cy="676" r="10" class="member"/>
  <text x="528" y="682">Member</text>
  <circle cx="620" cy="676" r="10" class="trainer"/>
  <text x="677" y="682">Trainer</text>
  <circle cx="770" cy="676" r="10" class="admin"/>
  <text x="825" y="682">Admin</text>
  <text x="580" y="717" class="small">Colored circles identify roles with access to each page.</text>
</svg>
