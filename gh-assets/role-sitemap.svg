    .heading { font-weight: 700; }
    .tick { text-anchor: middle; font-size: 19px; font-weight: 700; }
    .guest rect { fill: #1d4ed8; }
    .guest text { fill: #ffffff; }
    .member rect { fill: #15803d; }
    .member text { fill: #ffffff; }
    .trainer rect { fill: #f97316; }
    .trainer text { fill: #17231d; }
    .admin rect { fill: #7e22ce; }
    .admin text { fill: #ffffff; }
    .unavailable text { fill: #65736b; text-anchor: middle; }
  </style>
