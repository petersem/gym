<svg xmlns="http://www.w3.org/2000/svg" width="820" height="522" viewBox="0 0 820 522" role="img" aria-labelledby="title description">
  <title id="title">Gym sitemap by role</title>
  <desc id="description">Page access for Guest, Member, Trainer and Admin. Allowed pages have a tick on a blue, green, orange or purple background respectively. Trainers can manage only their own sessions. Guests can only view, not book sessions. Annotations are provided in the README.</desc>
