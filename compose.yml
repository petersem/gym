services:
  gymdb:
    image: petersem/gym-db:latest
    container_name: gym-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      # Enable or disable data seeding - can only run on initial database creation
      DATA_SEED: ${DATA_SEED}
    ports:
      - ${DB_PORT}:3306
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      # $$ defers expansion to the container so the healthcheck uses its own root password.
      test:
        [
          "CMD-SHELL",
          'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -uroot',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  gymapp:
    image: petersem/gym:latest
    container_name: gym-app
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: gymdb
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_SEED_PASSWORD: ${ADMIN_PASSWORD}
    command:
      [
        "sh",
        "-c",
        "node backend/src/scripts/seedAdmin.mjs && exec node backend/src/server.mjs",
      ]
    depends_on:
      gymdb:
        condition: service_healthy

volumes:
  db-data:
