services:
  db:
    image: mysql:8.0
    container_name: gym-db
    restart: unless-stopped
    entrypoint: ["bash", "/opt/gym/start-db.sh"]
    command: ["mysqld"]
    environment:
      MYSQL_DATABASE: gym
      MYSQL_USER: gymuser
      MYSQL_PASSWORD: Testing123!
      MYSQL_ROOT_PASSWORD: rootpassword
      # Enable or disable data seeding - can only run on initial database creation
      DATA_SEED: true
    ports:
      - "${DB_PUBLISHED_PORT:-3308}:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed-if-enabled.sh:/docker-entrypoint-initdb.d/02-seed.sh:ro
      - ./db/seed.sql:/opt/gym/seed.sql:ro
      - ./db/start-db.sh:/opt/gym/start-db.sh:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-prootpassword",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: gym-app
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: gymuser
      DB_PASSWORD: Testing123!
      DB_NAME: gym
      ADMIN_EMAIL: admin@example.com
      ADMIN_SEED_PASSWORD: testing123
    command:
      [
        "sh",
        "-c",
        "node backend/src/scripts/seedAdmin.mjs && exec node backend/src/server.mjs",
      ]
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
